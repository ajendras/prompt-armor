<text x="50" y="360" class="l" style="animation:show .01s 8.87s forwards" fill="#94a3b8">0.87</text>
<text x="50" y="386" class="l" style="animation:show .01s 9.09s forwards" fill="#94a3b8">Status: BLOCKED</text>
